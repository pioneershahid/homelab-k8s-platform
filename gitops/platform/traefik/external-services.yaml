# External Non-Kubernetes Services on your Home LAN
# Maps Proxmox, Pi-hole, Gitea, Home Assistant to Traefik IngressRoutes
apiVersion: v1
kind: Service
metadata:
  name: ext-proxmox
  namespace: homelab
spec:
  ports:
    - port: 8006
      name: https
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-proxmox
  namespace: homelab
subsets:
  - addresses:
      - ip: 192.168.1.35
    ports:
      - port: 8006
        name: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ext-proxmox-route
  namespace: homelab
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`proxmox.shahidmustafa.ie`)
      kind: Rule
      services:
        - name: ext-proxmox
          port: 8006
          scheme: https
      middlewares:
        - name: authelia
        - name: default-headers
---
