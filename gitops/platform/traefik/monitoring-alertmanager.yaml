apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager-route
  namespace: monitoring
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`alertmanager.k8s.local`)
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
