apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/morgoved/wazuh-helm.git
    targetRevision: main
    path: charts/wazuh
    helm:
      releaseName: wazuh
      values: |
        indexer:
          enabled: true
          replicas: 1
          storageSize: 20Gi
          storageClass: smb

        wazuh:
          enabled: true
          master:
            enabled: true
            storageSize: 50Gi
            storageClass: smb
          worker:
            enabled: false

        dashboard:
          enabled: true
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true