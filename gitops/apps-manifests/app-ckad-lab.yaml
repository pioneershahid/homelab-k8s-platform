apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ckad-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/pioneershahid/homelab-k8s-platform.git'
    targetRevision: HEAD
    path: gitops/apps/ckad-lab
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
