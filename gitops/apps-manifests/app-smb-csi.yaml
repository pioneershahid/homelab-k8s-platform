apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smb-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-csi.github.io/csi-driver-smb'
    chart: csi-driver-smb
    targetRevision: v1.20.4
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
