apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://jameswynn.github.io/helm-charts'
    chart: homepage
    targetRevision: 2.1.0
    helm:
      values: |
        image:
          tag: latest

        env:
          HOMEPAGE_VAR_AUTH_ENABLED: "false"

        ingress:
          main:
            enabled: true
            ingressClassName: traefik
            hosts:
              - host: homepage.k8s.local
                paths:
                  - path: /
                    pathType: Prefix
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: homelab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
