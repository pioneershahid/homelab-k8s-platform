
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.monitoring.coreos.com_Alertmanager: |
    hs = {
      status = "Progressing",
      message = "Waiting for Alertmanager"
    }

    if obj.status ~= nil and obj.status.conditions ~= nil then
      local available = false
      local reconciled = false

      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Available" and condition.status == "True" then
          available = true
        end

        if condition.type == "Reconciled" and condition.status == "True" then
          reconciled = true
        end
      end

      if available and reconciled then
        hs.status = "Healthy"
        hs.message = "Alertmanager is available and reconciled"
      else
        hs.status = "Degraded"
        hs.message = "Alertmanager is not available or reconciled"
      end
    end

    return hs
